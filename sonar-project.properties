# Análisis de SonarQube Cloud.
#
# Lo lanza el pipeline después de correr las pruebas, que son las que generan
# los reportes de cobertura de reports/pruebas/.

sonar.host.url=https://sonarcloud.io
sonar.organization=perlague
sonar.projectKey=Perlague_Drivesidian
sonar.projectName=Drivesidian
sonar.sourceEncoding=UTF-8

# Código propio: servidor, agente y el JavaScript del panel.
sonar.sources=server/src,server/index.js,agent/src,web/public/js,web/views
sonar.tests=server/tests,agent/tests

# Las librerías de terceros servidas desde el propio servidor no son código del
# proyecto: se actualizan a mano desde su publicación oficial (ver DESPLIEGUE.md).
sonar.exclusions=web/public/vendor/**,**/node_modules/**

# Cobertura de las pruebas del servidor y del agente. Las rutas del lcov van
# desde la raíz del repositorio (ver server/tests/correr.js).
sonar.javascript.lcov.reportPaths=reports/pruebas/servidor-lcov.info,reports/pruebas/agente-lcov.info

# El JavaScript del navegador y las plantillas se verifican con las pruebas de
# integración de páginas (server/tests/integracion/paginas.test.js) y en
# navegador, no con cobertura de líneas: no corren en Node.
sonar.coverage.exclusions=web/**

# Base del despliegue: Postgres + la API. El proxy va en una override, porque
# hay dos caminos y son excluyentes:
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.caddy.yml   → dominio + TLS propio
#   COMPOSE_FILE=docker-compose.yml:docker-compose.ngrok.yml   → túnel, sin dominio
#
# Esa línea va en el .env, así que el comando sigue siendo uno solo:
# git clone + llenar .env + docker compose up -d
#
# Va en una override y no en perfiles porque compose interpola TODO el archivo
# antes de aplicar los perfiles: un ${DOMAIN:?} en un servicio desactivado
# tumbaría igual el arranque del otro camino. Verificado.
#
# Los límites de memoria están dimensionados para la t3.small de 2 GB, que
# además comparte máquina con OpenClaw/Guardian. Son un punto de partida:
# ajústalos con `docker stats` y `free -h` sobre la instancia real.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: drivesidian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en el .env}
      POSTGRES_DB: drivesidian
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Los valores por defecto de Postgres asumen tener la máquina para él solo.
    # Cada conexión es un proceso aparte, así que max_connections pesa tanto
    # como shared_buffers. El pool de `pg` usa 8, más una para las migraciones.
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=384MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c max_connections=20
    healthcheck:
      # El server espera a que esto pase antes de intentar migrar.
      test: ["CMD-SHELL", "pg_isready -U drivesidian -d drivesidian"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 512m
    # NO se publica el puerto 5432: Postgres solo es accesible desde la red
    # interna de compose, igual que dice el Security Group de la EC2.
    networks: [interna]

  server:
    build:
      # La raíz del monorepo, porque la imagen necesita server/ y web/.
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://drivesidian:${POSTGRES_PASSWORD}@postgres:5432/drivesidian

      # Caddy va delante, así que req.ip solo es la IP real del cliente si
      # Express confía en un salto de proxy. Sin esto, TODOS los eventos de
      # seguridad llegarían con la IP del contenedor de Caddy.
      TRUST_PROXY: 1

      # De aquí sale la URL de vinculación que el agente abre en el navegador.
      # Ninguna es obligatoria: si las dos van vacías el servidor le pregunta al
      # túnel de ngrok, y si tampoco hay túnel cae a localhost. El orden y el
      # porqué están en server/src/utils/publicUrl.js.
      PUBLIC_URL: ${PUBLIC_URL:-}
      DOMAIN: ${DOMAIN:-}

      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en el .env}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?falta TOTP_ENCRYPTION_KEY en el .env}
      NTFY_SECRET: ${NTFY_SECRET:?falta NTFY_SECRET en el .env}

      GITHUB_TOKEN: ${GITHUB_TOKEN:?falta GITHUB_TOKEN en el .env}
      GITHUB_OWNER: ${GITHUB_OWNER:?falta GITHUB_OWNER en el .env}
      GITHUB_REPO: ${GITHUB_REPO:?falta GITHUB_REPO en el .env}
      GITHUB_BRANCH: ${GITHUB_BRANCH:-main}

      SYNC_INTERVAL_MS: ${SYNC_INTERVAL_MS:-300000}
      SECURITY_EVENT_RETENTION_DAYS: ${SECURITY_EVENT_RETENTION_DAYS:-90}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 384m
    # El feed de seguridad sale por stdout, así que Guardian lo sigue con
    # `docker compose logs -f server | grep drivesidian.security`. La rotación
    # evita que llene el disco de la instancia.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks: [interna]

volumes:
  postgres-data:

networks:
  interna:
